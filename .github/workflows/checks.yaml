name: Pre-release Checks

on:
  workflow_call:
  pull_request:
  merge_group:
  push:
    # Development branches build too. Without this, work in progress is only
    # ever verified by a manual dispatch, which is easy to forget precisely
    # when it matters. Pull requests and main are covered by the triggers
    # above; this covers the branch before a pull request exists.
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Code Quality and Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run unit tests
        run: go test ./...

      - name: Run tests with race detector
        run: go test -race ./...

      # The kernel comparison shells out to dpkg. The runner has dpkg, and a
      # container cannot cover this: /proc/sys/kernel/osrelease reports the
      # host kernel, which no packaged kernel in the container ever matches.
      - name: Run dpkg-backed collector tests
        run: go test -tags=integration ./internal/apt/

      - name: Run Go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'gofmt reported unformatted files:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      # Built from source with this module's toolchain rather than taken from
      # a release: the published binaries are built with an older Go than the
      # go directive here, and golangci-lint refuses to analyse a module that
      # targets a newer language version than it was built with.
      - name: Run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      - name: Validate installer scripts
        run: |
          sh -n install.sh
          sh -n integration/installer/dnf
          shellcheck install.sh integration/installer/dnf

      - name: Scan for vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  template:
    name: Zabbix Template Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Start Zabbix test environment
        run: |
          docker compose \
            -p package-updates-template-tests \
            -f integration/templates/docker-compose.yaml \
            up -d

      - name: Test template imports, preprocessing, discovery, and triggers
        run: go test -tags=integration -race ./templates -count=1 -timeout=10m -v

      - name: Show Zabbix logs on failure
        if: failure()
        run: |
          docker compose \
            -p package-updates-template-tests \
            -f integration/templates/docker-compose.yaml \
            logs --no-color

      - name: Stop Zabbix test environment
        if: always()
        run: |
          docker compose \
            -p package-updates-template-tests \
            -f integration/templates/docker-compose.yaml \
            down -v --remove-orphans
