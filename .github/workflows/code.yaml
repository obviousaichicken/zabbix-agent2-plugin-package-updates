name: Code Checks

on:
  workflow_call:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Code Quality and Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'gofmt reported unformatted files:\n%s\n' "$unformatted" >&2
            exit 1
          fi

      # Built from source with this module's toolchain rather than taken from
      # a release: the published binaries are built with an older Go than the
      # go directive here, and golangci-lint refuses to analyse a module that
      # targets a newer language version than it was built with.
      - name: Run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      - name: Validate workflows and scripts
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@latest
          sh -n install.sh
          sh -n integration/installer/dnf
          sh -n integration/zabbix-agent2/fakebin/*
          bash -n integration/ci/*.sh
          shellcheck \
            install.sh \
            integration/installer/dnf \
            integration/zabbix-agent2/fakebin/* \
            integration/ci/*.sh
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" \
            python3 -m py_compile integration/ci/*.py

      - name: Scan for vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
