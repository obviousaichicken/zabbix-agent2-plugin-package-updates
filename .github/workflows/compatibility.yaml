name: Compatibility Tests

on:
  workflow_call:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Compatibility Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build plugin and integration tests
        run: |
          mkdir -p dist/compatibility
          CGO_ENABLED=0 go build \
            -o dist/compatibility/zabbix-agent2-plugin-package-updates \
            ./cmd/agent
          CGO_ENABLED=0 go test -tags=integration -c \
            -o dist/compatibility/integration.test \
            ./integration
          CGO_ENABLED=0 go test -tags=integration -c \
            -o dist/compatibility/apt-dpkg.test \
            ./internal/apt

      - uses: actions/upload-artifact@v7
        with:
          name: compatibility-plugin
          path: dist/compatibility/zabbix-agent2-plugin-package-updates
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: compatibility-integration-test
          path: dist/compatibility/integration.test
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: compatibility-apt-dpkg-test
          path: dist/compatibility/apt-dpkg.test
          retention-days: 1

  hosts:
    name: Host Platforms
    needs: build
    uses: ./.github/workflows/_compat-hosts.yaml

  agent2:
    name: Agent 2 Protocol
    needs: build
    uses: ./.github/workflows/_compat-agent2.yaml

  templates:
    name: Zabbix Templates
    uses: ./.github/workflows/_compat-templates.yaml

  compatibility:
    name: Compatibility
    if: always()
    needs: [build, hosts, agent2, templates]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify all compatibility suites passed
        env:
          HOSTS_RESULT: ${{ needs.hosts.result }}
          AGENT2_RESULT: ${{ needs.agent2.result }}
          TEMPLATES_RESULT: ${{ needs.templates.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          failed=0
          for result in \
            "$BUILD_RESULT" \
            "$HOSTS_RESULT" \
            "$AGENT2_RESULT" \
            "$TEMPLATES_RESULT"; do
            printf 'suite result: %s\n' "$result"
            if [ "$result" != success ]; then
              failed=1
            fi
          done
          exit "$failed"
