name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  checks:
    name: Pre-release Checks
    uses: ./.github/workflows/checks.yaml

  integration:
    name: Package Updates Integration Tests
    uses: ./.github/workflows/package-updates-integration.yaml

  release:
    name: Build and Publish Release
    needs:
      - checks
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build plugin
        env:
          CGO_ENABLED: '0'
          GOARCH: amd64
          GOOS: linux
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' \
            -o dist/zabbix-agent2-plugin-package-updates ./cmd/agent

      - name: Create checksum
        run: |
          cd dist
          sha256sum zabbix-agent2-plugin-package-updates > zabbix-agent2-plugin-package-updates.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/zabbix-agent2-plugin-package-updates \
            dist/zabbix-agent2-plugin-package-updates.sha256 \
            package-updates.conf \
            install.sh \
            template-package-updates-by-zabbix-agent2.yaml \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --verify-tag

  smoke:
    name: Published Release Installation Tests
    needs: release
    uses: ./.github/workflows/release-smoke.yaml
